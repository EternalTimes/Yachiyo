[package]
name = "yachiyo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "yachiyo"
path = "src/main.rs"

[dependencies]
yachiyo-core = { path = "../yachiyo-core" }
yachiyo-inbound = { path = "../yachiyo-inbound" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
clap = { workspace = true, features = ["derive", "std", "help", "usage"] }
thiserror = { workspace = true }
